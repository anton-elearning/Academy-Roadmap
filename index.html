<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Академия Атташе</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link
  href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400;1,600&family=Inter:wght@400;500;600;700&display=swap"
  rel="stylesheet"
>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #e9e8e2; font-family: Georgia, "Times New Roman", serif; }

    .map {
  position: relative;

  width: min(100vw, 1600px);

  /*
    Большая вертикальная карта:
    ширина : высота = 16 : 27.
  */
  aspect-ratio: 16 / 27;

  margin: 0 auto;

  overflow: hidden;
  isolation: isolate;

  background: #d9d8d1;
}

    .map__background { position: absolute; inset: 0; z-index: 0; width: 100%; height: 100%; object-fit: cover; opacity: 0; animation: fade-in 700ms ease-out forwards; }
    .map__wash { position: absolute; inset: 0; z-index: 1; background: rgba(250,249,245,.6); opacity: 0; animation: fade-in 2000ms ease-out 2000ms forwards; pointer-events: none; }
    .map__route-image { position: absolute; inset: 0; z-index: 2; width: 100%; height: 100%; object-fit: contain; opacity: 0; animation: fade-in 600ms ease-out 1650ms forwards; pointer-events: none; }
    #points-layer { position: absolute; inset: 0; z-index: 3; }
    :root {
  --popup-paper-1: #fbf8f0;
  --popup-paper-2: #f5f0e5;

  --popup-ink: #20272e;
  --popup-text: #4a4b49;
  --popup-muted: #7f7a70;

  --popup-gold: #987d58;
  --popup-gold-line: rgba(126, 105, 76, .28);

  --popup-shadow: rgba(0, 0, 0, .50);
  --popup-overlay: rgba(13, 15, 19, .88);
}

    /* Общий контейнер любого поинта */
    .map-point {
      position: absolute;
      left: var(--x);
      top: var(--y);
      padding: 0;
      border: 0;
      background: transparent;
      cursor: pointer;
      opacity: 0;
      pointer-events: none;
      transition: opacity .35s ease, transform .45s cubic-bezier(.22,1.2,.36,1);
    }

   /* hidden: серая точка на маршруте, но недоступна для клика */
.map-point--hidden {
  width: clamp(14px, 1.25vw, 20px);
  height: clamp(14px, 1.25vw, 20px);
   z-index: 3;

  border-radius: 50%;
  background: #8d8d89;
  box-shadow:
    0 2px 6px rgba(0, 0, 0, .18),
    0 0 0 2px rgba(255, 255, 255, .42);

  opacity: .98;
  pointer-events: none;
  cursor: default;

  transform: translate(-50%, -50%) scale(1);
}

    /* 2. unhidden: текущая активная локация — красный пин */
    .map-point--unhidden {
      width: clamp(42px, 4.5vw, 58px);
      height: clamp(42px, 4.5vw, 58px);
       z-index: 4;
      transform: translate(-50%, -100%) scale(.55);
    }
    .map-point--unhidden.is-visible {
      opacity: 1;
      pointer-events: auto;
      transform: translate(-50%, -100%) scale(1);
    }
    .map-point--unhidden::before {
      content: "";
      position: absolute;
      inset: -16px;
      border: 2px solid rgba(221,70,59,.5);
      border-radius: 50%;
      animation: pulse 1.8s ease-out infinite;
    }
    .map-point__pin { position: absolute; inset: 0; display: grid; place-items: center; border-radius: 50% 50% 50% 0; transform: rotate(-45deg); background: #df463c; box-shadow: 0 8px 18px rgba(0,0,0,.28); transition: transform .2s ease, background .2s ease; }
    .map-point__pin::after { content: ""; width: 34%; height: 34%; border-radius: 50%; background: #fff; }
    .map-point--unhidden:hover .map-point__pin, .map-point--unhidden:focus-visible .map-point__pin { background: #c9332c; transform: rotate(-45deg) scale(1.08); }

    /* 3. completed: завершенная локация — небольшой черный кликабельный круг */
    .map-point--completed {
      width: clamp(18px, 1.6vw, 24px);
      height: clamp(18px, 1.6vw, 24px);
       z-index: 5;
      border-radius: 50%;
      background: #272726;
      box-shadow: 0 3px 8px rgba(0,0,0,.28), 0 0 0 3px rgba(255,255,255,.52);
      transform: translate(-50%, -50%) scale(.55);
    }
    .map-point--completed.is-visible {
      opacity: 1;
      pointer-events: auto;
      transform: translate(-50%, -50%) scale(1);
    }
    .map-point--completed:hover, .map-point--completed:focus-visible { background: #050505; transform: translate(-50%, -50%) scale(1.18); }
    .map-point:focus-visible { outline: 3px solid rgba(25,25,25,.7); outline-offset: 6px; }

    .map-point__label { position: absolute; right: 80%; bottom: 34%; width: max-content; max-width: min(290px,42vw); padding: 12px 17px; border: 1.5px solid #242321; border-radius: 14px; background: rgba(255,255,255,.96); color: #171614; font-size: clamp(15px,1.65vw,23px); line-height: 1.16; text-align: left; box-shadow: 0 6px 16px rgba(0,0,0,.08); pointer-events: none; }
    .map-point--completed .map-point__label { display: none; }

    /* Затемнение всей карты под popup */
.popup {
  position: fixed;
  inset: 0;
  z-index: 50;

  display: grid;
  place-items: center;

  padding: 28px;

  background: var(--popup-overlay);
  backdrop-filter: blur(4px);
}

.popup[hidden] {
  display: none;
}

/* Основная кремовая карточка */
.popup__card {
  position: relative;

  width: min(930px, 100%);
  max-height: min(88vh, 920px);

  overflow: auto;

  padding: 54px 76px 60px;

  color: var(--popup-ink);

  border: 1px solid rgba(105, 86, 58, .10);
  border-radius: 18px;

  background:
    radial-gradient(
      circle at 12% 10%,
      rgba(255, 255, 255, .98),
      transparent 34%
    ),
    linear-gradient(
      135deg,
      var(--popup-paper-1) 0%,
      var(--popup-paper-2) 100%
    );

  box-shadow:
    0 28px 80px var(--popup-shadow),
    0 1px 0 rgba(255, 255, 255, .90) inset;

  animation: popup-appear .28s ease-out;
}

/* Тонкая внутренняя рамка, как в ментальной карте */
.popup__card::after {
  content: "";

  position: absolute;
  z-index: 1;

  inset: 0 44px 34px;

  border: 24px solid var(--popup-paper-1);
  border-radius: 18px;

  pointer-events: none;
}

/* Весь настоящий контент — выше декоративной рамки */
.popup__card > * {
  position: relative;
  z-index: 2;
}

@keyframes popup-appear {
  from {
    opacity: 0;
    transform: translateY(14px) scale(.99);
  }

  to {
    opacity: 1;
    transform: translateY(0) scale(1);
  }
}

/* Кнопка закрытия */
.popup__close {
  position: absolute;
  z-index: 20;

  top: 18px;
  right: 20px;

  width: 38px;
  height: 38px;

  display: grid;
  place-items: center;

  padding: 0;

  color: var(--popup-muted);

  border: 1px solid rgba(126, 105, 76, .22);
  border-radius: 50%;

  background: rgba(251, 248, 240, .88);
  backdrop-filter: blur(6px);

  box-shadow: 0 3px 12px rgba(0, 0, 0, .08);

  font-family: Inter, Arial, sans-serif;
  font-size: 28px;
  font-weight: 300;
  line-height: 1;

  cursor: pointer;

  transition: .2s ease;
}

.popup__close:hover,
.popup__close:focus-visible {
  color: var(--popup-ink);
  background: #fff;
  transform: scale(1.06);
}

/* Заголовок локации */
.popup__title {
  max-width: 680px;

  margin: 0 auto 38px;

  color: var(--popup-ink);

  font-family: "Cormorant Garamond", Georgia, serif;
  font-size: clamp(34px, 4vw, 47px);
  font-weight: 500;
  line-height: 1.05;
  letter-spacing: -.015em;
  text-align: center;
}

/* Тонкий разделитель под заголовком */
.popup__title::after {
  content: "";

  display: block;

  width: 100%;
  height: 1px;

  margin-top: 22px;

  background: var(--popup-gold-line);
}

/* Основной текст popup */
.popup__content {
  color: var(--popup-text);

  font-family: "Cormorant Garamond", Georgia, serif;
  font-size: clamp(22px, 2.25vw, 28px);
  font-weight: 400;
  line-height: 1.42;
  letter-spacing: .012em;

  scrollbar-color: #c4ad85 transparent;
  scrollbar-width: thin;
}

.popup__content p {
  margin: 0 0 28px;
}

.popup__content h2,
.popup__content h3 {
  margin: 0 0 32px;

  color: var(--popup-ink);

  font-family: "Cormorant Garamond", Georgia, serif;
  font-size: clamp(35px, 4vw, 48px);
  font-weight: 500;
  line-height: 1.06;
}

.popup__content h4 {
  margin: 32px 0 14px;

  color: #252b30;

  font-family: "Cormorant Garamond", Georgia, serif;
  font-size: clamp(28px, 3vw, 35px);
  font-weight: 600;
  line-height: 1.1;
}

.popup__content strong {
  color: var(--popup-ink);
  font-weight: 650;
}

.popup__content blockquote {
  margin: 34px 0;
  padding: 0 0 0 28px;

  color: #594d3d;

  border-left: 2px solid #b69a70;

  font-style: italic;
}

/* CTA в конце лонгрида */
/* CTA кнопка перехода */
.popup-cta {
  display: flex !important;
  align-items: center;
  justify-content: center;
  width: max-content;
  min-width: 240px;
  max-width: 90%;
  margin: 32px auto 10px auto !important; /* центрирует по горизонтали */
  padding: 14px 32px;
  color: var(--popup-ink);
  border: 1px solid var(--popup-ink);
  border-radius: 4px;
  background: transparent;
  font-family: 'Inter', Arial, sans-serif;
  font-size: 13px;
  font-weight: 600;
  line-height: 1.2;
  letter-spacing: .12em;
  text-transform: uppercase;
  cursor: pointer;
  transition: all .2s ease;
  text-align: center;
}

.popup-cta:hover,
.popup-cta:focus-visible {
  color: var(--popup-paper-1);
  background: var(--popup-ink);
  transform: translateY(-1px);
}

    @keyframes fade-in { to { opacity: 1; } }
    @keyframes point-reveal-active { from { opacity: 0; transform: translate(-50%,-100%) scale(.55); } to { opacity: 1; transform: translate(-50%,-100%) scale(1); } }
    @keyframes point-reveal-completed { from { opacity: 0; transform: translate(-50%,-50%) scale(.55); } to { opacity: 1; transform: translate(-50%,-50%) scale(1); } }
    @keyframes pulse { 0% { transform: scale(.6); opacity: .8; } 75%,100% { transform: scale(1.35); opacity: 0; } }

    @media (prefers-reduced-motion: reduce) {
      .map__background,.map__wash,.map__route-image { animation: none; opacity: 1; }
      .map-point { transition: none; }
      .map-point--unhidden.is-visible { transform: translate(-50%,-100%) scale(1); }
      .map-point--completed.is-visible { transform: translate(-50%,-50%) scale(1); }
      .map-point--unhidden::before { animation: none; }
    }
    @media (max-width: 700px) {
  .popup {
    padding: 12px;
  }

  .popup__card {
    width: 100%;
    max-height: calc(100vh - 24px);

    padding: 44px 28px 38px;

    border-radius: 16px;
  }

  .popup__card::after {
    inset: 0 16px 28px;
    border-width: 16px;
    border-radius: 16px;
  }

  .popup__close {
    top: 12px;
    right: 12px;
  }

  .popup__title {
    margin-bottom: 28px;
  }

  .popup__content {
    font-size: 22px;
  }
}
/* ==========================================
   УРОКИ, ТЕСТЫ И ЧАТ — СТИЛИ POPUP
   ========================================== */

.popup__content .quiz-container {
  margin-top: 24px;
  padding: 24px;

  border: 1px solid rgba(126, 105, 76, .20);
  border-radius: 8px;

  background: #f9f9f9;
}

.popup__content .quiz-question {
  margin-bottom: 15px;

  color: #333;

  font-family: Inter, Arial, sans-serif;
  font-size: 20px;
  font-weight: 700;
}

.popup__content .quiz-options {
  display: flex;
  flex-direction: column;
  gap: 10px;
}

.popup__content .quiz-option {
  display: flex;
  align-items: center;

  padding: 12px 15px;

  color: #333;

  border: 1px solid #ddd;
  border-radius: 6px;

  background: #fff;

  font-family: Inter, Arial, sans-serif;
  font-size: 17px;

  cursor: pointer;
  transition: background .2s ease;
}

.popup__content .quiz-option:hover {
  background: #f1f1f1;
}

.popup__content .quiz-option input[type="radio"],
.popup__content .quiz-option input[type="checkbox"] {
  margin-right: 12px;
  transform: scale(1.2);
  cursor: pointer;
  accent-color: #1f252b;
}

.popup__content .quiz-submit,
.popup__content .btn-black.btn-outline {
  display: inline-flex;
  align-items: center;
  justify-content: center;

  margin-top: 20px;
  padding: 11px 26px;

  color: #1f252b;

  border: 1px solid #1f252b;
  border-radius: 4px;

  background: transparent;

  font-family: Inter, Arial, sans-serif;
  font-size: 13px;
  font-weight: 600;
  letter-spacing: .12em;
  text-transform: uppercase;

  cursor: pointer;
  transition: all .2s ease;
}

.popup__content .quiz-submit:hover:not(:disabled),
.popup__content .btn-black.btn-outline:hover {
  color: #fbf8f0;
  background: #1f252b;
  transform: translateY(-1px);
}

.popup__content .quiz-submit:disabled {
  opacity: .45;
  cursor: not-allowed;
}

.popup__content .quiz-feedback {
  display: none;

  margin-top: 20px;
  padding: 18px 22px;

  border-radius: 6px;

  font-family: Inter, Arial, sans-serif;
  font-size: 17px;
  line-height: 1.5;
}

.popup__content .feedback-correct {
  color: #1b3d22 !important;
  border: 1px solid #b2d3b8;
  background: #eaf2eb;
}

.popup__content .feedback-wrong {
  color: #611a1a !important;
  border: 1px solid #e7bebe;
  background: #fbeded;
}

.popup__content .feedback-correct strong {
  color: #15451e !important;
  font-weight: 700;
}

.popup__content .feedback-wrong strong {
  color: #7a1c1c !important;
  font-weight: 700;
}

/* Чат с персонажем */
.popup__content .story-chat-box {
  display: flex;
  flex-direction: column;
  gap: 20px;

  margin: 35px 0;
  padding: 24px;

  color: #e5e8f1;

  border: 1px solid rgba(139, 115, 85, .35);
  border-radius: 16px;

  background: #111317;

  box-shadow: 0 14px 35px rgba(0, 0, 0, .25);

  font-family: Inter, Arial, sans-serif;
}

.popup__content .story-chat-header {
  display: flex;
  align-items: center;
  gap: 14px;

  margin-bottom: 2px;
  padding-bottom: 16px;

  border-bottom: 1px solid rgba(255, 255, 255, .08);
}

.popup__content .story-chat-avatar {
  display: grid;
  flex-shrink: 0;
  place-items: center;

  width: 44px;
  height: 44px;

  overflow: hidden;

  border: 1px solid rgba(218, 182, 109, .4);
  border-radius: 50%;

  background: #232730;

  font-size: 20px;
}

.popup__content .story-chat-avatar img {
  display: block;
  width: 100%;
  height: 100%;
  object-fit: contain;
}

.popup__content .story-chat-name {
  color: #fff;
  font-size: 16px;
  font-weight: 600;
}

.popup__content .story-chat-status {
  display: flex;
  align-items: center;
  gap: 6px;

  margin-top: 3px;

  color: #43c986;
  font-size: 12px;
}

.popup__content .story-chat-status::before {
  content: "";

  display: inline-block;

  width: 7px;
  height: 7px;

  border-radius: 50%;
  background: #43c986;
}

.popup__content .story-bubbles {
  display: flex;
  flex-direction: column;
  gap: 14px;
}

.popup__content .bubble {
  max-width: 85%;
  padding: 14px 18px;

  border-radius: 14px;

  font-size: 15px;
  line-height: 1.5;

  animation: chat-bubble-in .3s ease;
}

.popup__content .bubble.npc {
  align-self: flex-start;

  color: #e2e6f0;

  border-bottom-left-radius: 4px;
  border-left: 3px solid #b89764;

  background: #222630;
}

.popup__content .bubble.player {
  align-self: flex-end;

  color: #fff;

  border-right: 3px solid #3a86ff;
  border-bottom-right-radius: 4px;

  background: #2e3544;
}

.popup__content .chat-choices {
  display: flex;
  flex-direction: column;
  gap: 8px;

  margin-top: 4px;
}

.popup__content .chat-choice-btn {
  padding: 10px 16px;

  color: #dbe2ef;

  border: 1px solid rgba(255, 255, 255, .15);
  border-radius: 8px;

  background: rgba(255, 255, 255, .05);

  font-family: Inter, Arial, sans-serif;
  font-size: 14px;
  text-align: left;

  cursor: pointer;
  transition: all .2s ease;
}

.popup__content .chat-choice-btn:hover {
  color: #fff;

  border-color: #b89764;
  background: rgba(184, 151, 100, .20);
}

@keyframes chat-bubble-in {
  from {
    opacity: 0;
    transform: translateY(7px);
  }

  to {
    opacity: 1;
    transform: translateY(0);
  }
}

/* Ворота между частями лонгрида */
.popup__content .content-gate {
  margin: 35px 0;
  padding: 24px 0;

  border-top: 1px dashed rgba(126, 105, 76, .30);
  border-bottom: 1px dashed rgba(126, 105, 76, .30);

  text-align: center;
}

.popup__content .gate-btn,
.popup__content .inline-complete-btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;

  min-width: 220px;
  padding: 13px 32px;

  color: #1f252b;

  border: 1px solid #1f252b;
  border-radius: 4px;

  background: transparent;

  font-family: Inter, Arial, sans-serif;
  font-size: 13px;
  font-weight: 600;
  letter-spacing: .14em;
  text-transform: uppercase;

  cursor: pointer;
  transition: all .22s ease;
}

.popup__content .gate-btn:hover,
.popup__content .inline-complete-btn:hover {
  color: #fbf8f0;
  background: #1f252b;
  transform: translateY(-2px);
}

.popup__content .locked-section,
.popup__content .locked-theory,
.popup__content .quiz-gate.is-locked {
  display: none;
}

.popup__content .locked-section.unlocked,
.popup__content .locked-theory.unlocked,
.popup__content .quiz-gate.is-unlocked {
  display: block;
  animation: gate-appear .4s ease-out;
}
/* ==========================================
   КИНЕМАТОГРАФИЧЕСКОЕ ОТКРЫТИЕ ЛОКАЦИИ
   ========================================== */

/* Затемнение становится прозрачным, если у локации есть интерьер */
.popup.has-location-background {
  background: rgba(7, 8, 12, 0);
  transition: background .85s ease;
}

/* Фоновая картинка задана через --location-background */
.popup::before {
  content: "";

  position: absolute;
  z-index: -1;
  inset: 0;

  background-image: var(--location-background, none);
  background-position: center;
  background-size: cover;
  background-repeat: no-repeat;

  opacity: 0;

  filter: blur(0) brightness(1) saturate(1);
  transform: scale(1);

  transition:
    opacity .35s ease,
    filter 1s ease,
    transform 1s ease;
}

/* Шаг 1: фон стал видимым, но остается четким */
.popup.has-location-background::before {
  opacity: 1;
}

/* Шаг 2: затемняем и слегка размываем интерьер */
.popup.cinematic-blur {
  background: rgba(7, 8, 12, .64);
}

.popup.cinematic-blur::before {
  filter: blur(7px) brightness(.76) saturate(.88);
  transform: scale(1.04);
}

/*
  Пока идет первый и второй шаг, карточка скрыта.
  Не используйте display: none — иначе content не успеет
  корректно построить тесты и чат.
*/
.popup.cinematic-opening .popup__card {
  visibility: hidden;
  opacity: 0;
  pointer-events: none;
  transform: translateY(18px) scale(.985);
  animation: none;
}

/* Шаг 3: карточка появляется после размытия */
.popup.cinematic-ready .popup__card {
  visibility: visible;
  opacity: 1;
  pointer-events: auto;
  transform: translateY(0) scale(1);

  transition:
    opacity .55s ease-out,
    transform .55s ease-out;
}

@keyframes gate-appear {
  from {
    opacity: 0;
    transform: translateY(10px);
  }

  to {
    opacity: 1;
    transform: translateY(0);
  }
}
/* ==========================================
   ЧАТ С БОТОМ АКАДЕМИИ
   ========================================== */

.popup__content .academy-chat-card {
  display: flex;
  flex-direction: column;
  gap: 20px;

  margin: 35px 0;

  padding: 26px 22px;

  color: #e5e8f1;

  border: 1px solid rgba(255, 255, 255, .08);
  border-radius: 24px;

  background:
    radial-gradient(
      circle at center,
      #1b1c23 0%,
      #101116 100%
    );

  box-shadow:
    0 16px 40px rgba(0, 0, 0, .45),
    inset 0 1px 0 rgba(255, 255, 255, .08);

  font-family: Inter, Arial, sans-serif;
}

.popup__content .academy-chat-header {
  display: flex;
  align-items: center;
  gap: 14px;
}

.popup__content .academy-bot-avatar {
  display: flex;
  flex-shrink: 0;

/* =====================================================
   КИНЕМАТОГРАФИЧЕСКОЕ ОТКРЫТИЕ ПОПАПА С ФОНОМ ЛОКАЦИИ
   ===================================================== */

/*
  popup — полноэкранный внешний слой.
  isolation создаёт отдельный контекст слоев:
  фон ::before будет за карточкой, но не «уйдет» за карту.
*/
.popup {
  isolation: isolate;
  overflow: hidden;

  background: rgba(7, 8, 12, .72);
  transition: background .85s ease;
}

/* Фон конкретной локации: URL приходит из location.background */
.popup::before {
  content: "";

  position: absolute;
  z-index: -1;
  inset: 0;

  background-image: var(--location-background, none);
  background-position: center;
  background-size: cover;
  background-repeat: no-repeat;

  opacity: 0;

  filter: blur(0) brightness(1) saturate(1);
  transform: scale(1);

  transition:
    opacity .35s ease,
    filter 1s ease,
    transform 1s ease;
}

/*
  Шаг 1:
  Фон уже виден, но остается четким.
  Внешняя темная плашка пока прозрачна.
*/
.popup.has-location-background {
  background: rgba(7, 8, 12, 0);
}

.popup.has-location-background::before {
  opacity: 1;
}

/*
  Шаг 2:
  Через секунду картинка размывается,
  одновременно появляется темная плашка.
*/
.popup.cinematic-blur {
  background: rgba(7, 8, 12, .64);
}

.popup.cinematic-blur::before {
  filter: blur(7px) brightness(.76) saturate(.88);
  transform: scale(1.04);
}

/*
  Шаг 1 и 2:
  Карточка с лонгридом еще не должна быть видимой.
*/
.popup.cinematic-opening .popup__card {
  visibility: hidden !important;
  opacity: 0 !important;

  pointer-events: none !important;

  transform: translateY(18px) scale(.985) !important;

  animation: none !important;
  transition: none !important;
}

/*
  Шаг 3:
  Через две секунды карточка плавно появляется.
*/
.popup.cinematic-ready .popup__card {
  visibility: visible !important;
  opacity: 1 !important;

  pointer-events: auto !important;

  transform: translateY(0) scale(1) !important;

  transition:
    opacity .55s ease-out,
    transform .55s ease-out !important;
}

/* Карточка и крестик гарантированно выше фоновой картинки */
.popup__card {
  position: relative;
  z-index: 1;
}

  <p>Зрительный контакт &mdash; это фундаментальный инструмент установления иерархии и доверия в любом социальном взаимодействии. В светском и деловом этикете направление, продолжительность и фокус взгляда транслируют собеседнику ваш статус, уверенность и степень заинтересованности. Чрезмерно пристальный взгляд воспринимается как агрессия, а избегающий &mdash; как признак неуверенности или неискренности.</p>

function updatePopupMode() {

    function getLocation(id) { return locations.find((location) => location.id === id); }

    function pointMarkup(location) {
  return location.state === "unhidden"
    ? `<span class="map-point__pin" aria-hidden="true"></span>`
    : "";
}

    function applyPointState(location, animate = false) {
      const point = pointElements.get(location.id);
      if (!point) return;

      point.className = `map-point map-point--${location.state}`;
      point.innerHTML = pointMarkup(location);
      point.disabled = location.state === "hidden";
      point.setAttribute("aria-label", `Открыть локацию «${location.title}»`);
      point.setAttribute("aria-hidden", location.state === "hidden" ? "true" : "false");

      if (location.state !== "hidden") {
        point.classList.add("is-visible");
        if (animate) {
          point.style.animation = "none";
          void point.offsetWidth;
          point.style.animation = location.state === "unhidden"
            ? "point-reveal-active .55s cubic-bezier(.22,1.2,.36,1) both"
            : "point-reveal-completed .38s ease-out both";
          point.addEventListener("animationend", () => { point.style.animation = ""; }, { once: true });
        }
      }
    }

        point.addEventListener("click", () => openPopup(location.id, point));
        pointsLayer.appendChild(point);

    function openPopup(locationId, point) {
  const location = getLocation(locationId);

  if (!location || location.state === "hidden") return;

  currentPopupLocationId = locationId;
  lastOpenedPoint = point;

  const popupCard = popup.querySelector(".popup__card");

  function resetPopupScroll() {
    if (popupCard) {
      popupCard.scrollTop = 0;
      popupCard.scrollLeft = 0;
    }

    popupContent.scrollTop = 0;
    popupContent.scrollLeft = 0;
  }

  // Подставляем содержимое выбранной локации.
  popupTitle.textContent = location.title;
  popupContent.innerHTML = location.content;

  updatePopupMode();

  // Очищаем оформление предыдущей локации.
  popup.classList.remove(
    "has-location-background",
    "cinematic-opening",
    "cinematic-blur",
    "cinematic-ready"
  );

  popup.style.removeProperty("--location-background");

  if (location.background) {
    popup.style.setProperty(
      "--location-background",
      `url("${location.background}")`
    );

    popup.classList.add("has-location-background");
  }

  // Показываем внешний слой, пока карточка ещё скрыта.
  popup.classList.add("cinematic-opening");
  popup.hidden = false;
  popup.style.removeProperty("display");

  // Обнуляем прокрутку именно карточки.
  resetPopupScroll();

  requestAnimationFrame(() => {
    if (popup.hidden || currentPopupLocationId !== locationId) return;

    resetPopupScroll();
  });

  // Через секунду размываем фон.
  window.setTimeout(() => {
    if (popup.hidden || currentPopupLocationId !== locationId) return;

    popup.classList.add("cinematic-blur");
  }, 1000);

  // Ещё через секунду показываем карточку с начала.
  window.setTimeout(() => {
    if (popup.hidden || currentPopupLocationId !== locationId) return;

    resetPopupScroll();

    popup.classList.remove("cinematic-opening");
    popup.classList.add("cinematic-ready");

    closeButton.focus({ preventScroll: true });
  }, 2000);
}

 function closePopup() {

  popup.style.setProperty("display", "none", "important");

  currentPopupLocationId = null;

  lastOpenedPoint?.focus();
}

function checkMultiQuiz(buttonElement) {
  const quiz = buttonElement.closest(".quiz-container") || popupContent;

  const correctAnswers = (
    buttonElement.getAttribute("data-correct-answers") || ""
  )
    .split(",")
    .map((item) => item.trim())
    .filter(Boolean);

  const selectedCheckboxes = quiz.querySelectorAll(
    'input[name="multi-quiz-answer"]:checked'
  );

  const feedbackBox = quiz.querySelector("#multi-quiz-feedback-box");

  if (!selectedCheckboxes.length) {
    alert("Пожалуйста, выберите хотя бы один вариант!");
    return;
  }

  if (!feedbackBox) return;

  const selectedValues = Array.from(selectedCheckboxes).map(
    (checkbox) => checkbox.value
  );

  const isFullyCorrect =
    selectedValues.length === correctAnswers.length &&
    selectedValues.every((value) => correctAnswers.includes(value));

  feedbackBox.style.display = "block";
  buttonElement.disabled = true;
  buttonElement.style.opacity = ".5";

  if (isFullyCorrect) {
    feedbackBox.className = "quiz-feedback feedback-correct";
    feedbackBox.innerHTML = `
      <strong>Абсолютно верно!</strong><br><br>
      ${buttonElement.getAttribute("data-success-text") || ""}
    `;
  } else {
    feedbackBox.className = "quiz-feedback feedback-wrong";
    feedbackBox.innerHTML = `
      <strong>В ответе есть ошибка.</strong><br><br>
      ${buttonElement.getAttribute("data-fail-text") || ""}
    `;
  }
}

   ========================================== */
function submitDataset(
  formId,
  resultBoxId = "dataset-result",
  scoreValueId = "dataset-score-val",
  descriptionId = "dataset-desc-val"
) {
  const form = popupContent.querySelector(`#${formId}`);

  if (!form) return;

  const questionBlocks = form.querySelectorAll(".dataset-question");
  const totalQuestions = questionBlocks.length;

  let correctCount = 0;
  let hasUnanswered = false;

  questionBlocks.forEach((block) => {
    const checkboxes = block.querySelectorAll('input[type="checkbox"]');
    const radios = block.querySelectorAll('input[type="radio"]');

    if (checkboxes.length > 0) {
      const checkedBoxes = block.querySelectorAll(
        'input[type="checkbox"]:checked'
      );

      if (!checkedBoxes.length) {
        hasUnanswered = true;
        return;
      }

      let isBlockCorrect = true;

      checkboxes.forEach((checkbox) => {
        if (checkbox.checked && checkbox.value !== "1") {
          isBlockCorrect = false;
        }

        if (!checkbox.checked && checkbox.value === "1") {
          isBlockCorrect = false;
        }
      });

      if (isBlockCorrect) correctCount++;
    }

    if (radios.length > 0) {
      const selected = block.querySelector(
        'input[type="radio"]:checked'
      );

      if (!selected) {
        hasUnanswered = true;
        return;
      }

      if (selected.value === "1") correctCount++;
    }
  });

  if (hasUnanswered) {
    alert("Заполните все блоки датасета перед отправкой.");
    return;
  }

  const percentage = Math.round(
    (correctCount / totalQuestions) * 100
  );

  const submitButton = form.querySelector(".quiz-submit");

  if (submitButton) {
    submitButton.disabled = true;
    submitButton.style.opacity = ".5";
  }

  form.querySelectorAll("input").forEach((input) => {
    input.disabled = true;
  });

  const resultBox = popupContent.querySelector(`#${resultBoxId}`);
  const scoreValue = popupContent.querySelector(`#${scoreValueId}`);
  const description = popupContent.querySelector(`#${descriptionId}`);

  if (!resultBox || !scoreValue || !description) return;

  scoreValue.innerText = `${percentage}%`;

  if (percentage === 100) {
    description.innerHTML =
      "Калибровка завершена без ошибок. Вы уверенно считываете и транслируете невербальные сигналы.";
  } else if (percentage >= 60) {
    description.innerHTML =
      "Калибровка завершена. Базовые принципы усвоены, но отдельные сигналы требуют повторения.";
  } else {
    description.innerHTML =
      "Калибровка выявила уязвимые зоны. Вернитесь к материалу и повторите ключевые правила.";
  }

  resultBox.style.display = "block";
}

  }

  const isCorrect = selected.value === correctAnswer;

  const answerFeedback =
    selected.dataset.feedback ||
    "Ответ принят. Ознакомьтесь с пояснением и продолжайте.";

  quizContainer.querySelectorAll('input[type="radio"]').forEach((radio) => {
    radio.disabled = true;
  });

  button.disabled = true;
  button.style.opacity = ".5";
  feedbackBox.style.display = "block";

  if (isCorrect) {
    feedbackBox.className =
      "quiz-feedback feedback-correct scenario-feedback";

    feedbackBox.innerHTML = `
      <strong>Верное решение.</strong><br>
      ${answerFeedback}
    `;

    button.textContent = "Выбор принят ✓";

    if (gate) {
      gate.classList.remove("is-locked");
      gate.classList.add("is-unlocked");
    }

    return;
  }

  feedbackBox.className =
    "quiz-feedback feedback-wrong scenario-feedback";

  feedbackBox.innerHTML = `
    <strong>Пока не так.</strong><br>
    ${answerFeedback}
    <div class="scenario-retry-wrap">
      <button
        type="button"
        class="btn-black btn-outline"
        onclick="resetScenarioQuiz(this)"
      >
        Попробовать снова
      </button>
    </div>
  `;

  button.textContent = "Действие отклонено";

  if (gate) {
    gate.classList.remove("is-unlocked");
    gate.classList.add("is-locked");
  }
}

function resetScenarioQuiz(retryButton) {
  const quizContainer = retryButton.closest(".quiz-gated");

  if (!quizContainer) return;

  const feedbackBox = quizContainer.querySelector(".scenario-feedback");
  const submitButton = quizContainer.querySelector(".scenario-submit");
  const gateId = quizContainer.dataset.gateId;
  const gate = popupContent.querySelector(`#${gateId}`);

  quizContainer.querySelectorAll('input[type="radio"]').forEach((radio) => {
    radio.checked = false;
    radio.disabled = false;
  });

  if (submitButton) {
    submitButton.disabled = true;
    submitButton.style.opacity = ".45";
    submitButton.textContent = "Подтвердить действие";
  }

  if (feedbackBox) {
    feedbackBox.style.display = "none";
    feedbackBox.innerHTML = "";
    feedbackBox.className =
      "quiz-feedback scenario-feedback";
  }

  if (gate) {
    gate.classList.remove("is-unlocked");
    gate.classList.add("is-locked");
  }
}
/* ==========================================
   СЛАЙДЕРЫ В ЛОНГРИДАХ
   ========================================== */

function showSlide(button, direction) {
  const slider = button.closest(".slider-container");
  if (!slider) return;

  const slides = [...slider.querySelectorAll(".slide")];
  const currentIndex = slides.findIndex((slide) =>
    slide.classList.contains("active")
  );

  const nextIndex = Math.max(
    0,
    Math.min(slides.length - 1, currentIndex + direction)
  );

  slides.forEach((slide, index) => {
    slide.classList.toggle("active", index === nextIndex);
  });

  const previousButton = slider.querySelector("[data-slide-prev]");
  const nextButton = slider.querySelector("[data-slide-next]");
  const counter = slider.querySelector(".slide-counter");

  if (previousButton) previousButton.disabled = nextIndex === 0;
  if (nextButton) nextButton.disabled = nextIndex === slides.length - 1;

  if (counter) {
    counter.textContent = `${nextIndex + 1} / ${slides.length}`;
  }
}
function toggleInlineNote(button, noteId) {
  const note = popupContent.querySelector(`#${noteId}`);
  if (!note) return;

  note.classList.toggle("is-open");

  button.setAttribute(
    "aria-expanded",
    String(note.classList.contains("is-open"))
  );
}
/* ==========================================
   ЗАВЕРШЕНИЕ ЛОКАЦИИ ИЗ СТАРОГО КОНТЕНТА
   ========================================== */

function completeLocation(targetId = null) {
  if (!currentPopupLocationId) {
    closePopup();
    return;
  }

  const completedId = currentPopupLocationId;

  setCompleted(completedId);

  popup.hidden = true;

  popup.classList.remove(
    "has-location-background",
    "cinematic-opening",
    "cinematic-blur",
    "cinematic-ready",
    "iframe-mode",
    "battle-mode"
  );

  popup.style.removeProperty("--location-background");

  currentPopupLocationId = null;

  if (targetId) {
    window.setTimeout(() => {
      setUnhidden(targetId);
    }, 1000);
  }
}

const mapElement = document.querySelector(".map");

mapElement.addEventListener("click", (event) => {
  /*
    Не мешаем настоящим кликам по поинтам.
  */
  if (event.target.closest(".map-point")) return;

  const rect = mapElement.getBoundingClientRect();

  const x = (
    ((event.clientX - rect.left) / rect.width) * 100
  ).toFixed(1);

  const y = (
    ((event.clientY - rect.top) / rect.height) * 100
  ).toFixed(1);

  console.log(`x: ${x}, y: ${y}`);
});
